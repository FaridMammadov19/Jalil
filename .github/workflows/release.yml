name: Build distributable apps

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  package-macos:
    runs-on: macos-latest
    strategy:
      matrix:
        runtime: [osx-arm64, osx-x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
      - run: chmod +x scripts/package.sh
      - run: ./scripts/package.sh ${{ matrix.runtime }}
      - uses: actions/upload-artifact@v4
        with:
          name: Jalil-${{ matrix.runtime }}
          path: artifacts/Jalil-${{ matrix.runtime }}.zip
          if-no-files-found: error

  package-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
      - shell: pwsh
        run: ./scripts/package.ps1 win-x64
      - uses: actions/upload-artifact@v4
        with:
          name: Jalil-win-x64
          path: artifacts/Jalil-win-x64.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [package-macos, package-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release-assets/*.zip --generate-notes --title "$GITHUB_REF_NAME"
